<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="112.css">
    <title>الحضارة المصرية</title>
    <style>
        /* Basic styling suggestions (move these to your 112.css file) */
        .center-content {
            text-align: center; /* Centers content within this div */
        }

        .navigation {
             margin-bottom: 20px; /* Space below the navigation */
        }

        .navigation ul {
            list-style: none; /* Remove default list bullets */
            padding: 0; /* Remove default padding */
            margin: 0;
            text-align: center; /* Center the navigation links */
        }

        .navigation li {
            display: inline-block; /* Display links side-by-side */
            margin: 0 15px; /* Space between navigation links (adjust for RTL if needed) */
        }

        .names-section {
            margin-top: 20px; /* Space above the names */
            margin-bottom: 20px; /* Space below the names */
        }

         .names-section h2 {
            margin-bottom: 10px; /* Space below the heading */
         }

        .names-section h3 {
             margin: 0; /* Remove default margin from h3 */
        }

        /* Example of spacing between names using CSS */
        .names-section h3 span {
            margin-left: 20px; /* Space between names in RTL */
            /* Use margin-right for LTR */
        }


         .main-image {
             margin-top: 30px; /* Space above the image */
         }


    </style>
</head>
<body>

    <nav class="navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="department.html">1st page</a></li>
            <li><a href="#">2nd page</a></li>
        </ul>
    </nav>

    <div class="center-content names-section">
        <h2>اعداد</h2>
        <h3>
            <span>عبد الوهاب سالم</span>
            <span>عمر حبيب</span>
            <span>عزيز سعيد</span>
        </h3>
    </div>

    <div class="center-content main-image">
         <img src="img/115.jpeg" height="500" alt="Image related to Egyptian civilization">
    </div>

</body>
</html>
