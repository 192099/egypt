<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="111.css">
    <title>الحضارة المصرية</title>
    <style>
        /* Basic styling for centering and form layout */
        /* You can move these to your 111.css file */
        .center-content {
            text-align: center; /* Centers inline and inline-block elements */
            /* For block elements like the div containing the form, use margin: auto; */
        }

        .form-container {
            width: 300px; /* Example width */
            margin: 20px auto; /* Centers the block element div */
            text-align: left; /* Align form elements to the left within the container */
            padding: 20px;
            border: 1px solid #ccc; /* Example border */
        }

        .form-group {
            margin-bottom: 15px; /* Space between form groups */
        }

        .form-group label {
            display: block; /* Label on its own line */
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%; /* Input takes full width of container */
            padding: 8px;
            box-sizing: border-box; /* Include padding in the element's total width */
        }

        .form-group input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50; /* Example background */
            color: white;
            border: none;
            cursor: pointer;
        }

         /* Style for the heading - move to 111.css */
         /* Assuming you want to use the Kunstler Script font if available */
         h1 {
            font-family: "Kunstler Script", cursive; /* Fallback font */
         }


    </style>
</head>
<body dir="ltr">

    <div class="center-content">
        <h1>الحضارة المصرية</h1>
        <img src="img/111.jpeg" alt="Image related to Egyptian civilization">
    </div>

    <form action="department.html" method="get" class="form-container">
        <div class="form-group">
            <label for="username">username</label>
            <input type="text" id="username" name="username" placeholder="name" required>
        </div>

        <div class="form-group">
            <label for="password">password</label>
            <input type="password" id="password" name="password" placeholder="password" required>
        </div>

        <div class="form-group">
             <input type="submit" value="login">
             </div>
    </form>

</body>
</html>
